<style>
  :root{
    --paper:#FAF8F3;--card:#FFFFFF;--ink:#1F1D1A;--ink-2:#5C574F;--ink-3:#8E887E;--line:#E6E1D8;
    --kraft:#C47A2C;--kraft-ink:#7A4712;--kraft-soft:#F6E9D8;
    --ok:#2E7D4F;--ok-soft:#E3F2E8;--warn:#B54A1F;--warn-soft:#FBE7DE;--info:#2F5FB3;--info-soft:#E4ECF9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none} a:hover{color:var(--kraft-ink)}
  h1,h2,h3,.display{font-family:Sora,"IBM Plex Sans",system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-weight:600;letter-spacing:.06em}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
  .btn svg{width:18px;height:18px;flex-shrink:0}
  .btn.primary{background:var(--kraft);color:#fff;border-color:var(--kraft)}
  .btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
  .btn.ghost{background:transparent}
  .btn.big{height:60px;padding:0 24px;font-size:17px;border-radius:12px}
  .btn.block{width:100%}
  .chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip svg{width:14px;height:14px}
  .stamp{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1.5px solid currentColor}
  .stamp.wait{color:var(--kraft-ink);background:var(--kraft-soft)}
  .stamp.late{color:var(--warn);background:var(--warn-soft)}
  .stamp.done{color:var(--ok);background:var(--ok-soft)}
  .stamp.info{color:var(--info);background:var(--info-soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .photo{background:repeating-linear-gradient(135deg,#EFEAE0 0 10px,#E7E1D5 10px 20px);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
  .photo svg{width:34px;height:34px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;font-weight:600;color:var(--ink-2)}
  .input{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink-3);font-size:15px}
  .input svg{width:18px;height:18px;flex-shrink:0}
  .input.filled{color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--line);background:var(--card);padding:3px;border-radius:10px;gap:2px}
  .seg span{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font-weight:600;color:var(--ink-2)}
  .seg span.on{background:var(--ink);color:#fff}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
  .note{position:absolute;background:#1F1D1A;color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18);white-space:nowrap;z-index:5}
  .note.inl{position:static;white-space:normal;align-self:flex-start;box-shadow:none;font-weight:500}
  .callout{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2);background:rgba(255,255,255,.6)}
</style>
